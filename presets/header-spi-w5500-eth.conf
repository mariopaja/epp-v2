DESCRIPTION="LED + network + W5500 as second network interface (DHCP) on the header SPI (lpspi7)"
ZEPHYR_APP=xen_led_i2c_netfront
ZEPHYR_EXTRA="w5500-eth.overlay w5500-eth.conf"
PASSTHROUGH="lpi2c6 lpspi7"
# Header pins U-Boot switches at boot: the W5500 driver accesses the chip at
# Zephyr boot, before Dom0 would set the pins
EARLY_PINS="lpspi7"
