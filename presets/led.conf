# Preset for build-demo.sh: one per file, presets/<name>.conf
DESCRIPTION="LED D19 + network (GPIO2 only)"
# Zephyr application in zephyr/samples/
ZEPHYR_APP=xen_led_i2c_netfront
# Extra overlays (*.overlay) and Kconfig fragments (*.conf) from its directory
ZEPHYR_EXTRA=""
# Default passthrough option next to GPIO2: none, lpi2c4 or lpi2c6
PASSTHROUGH=none
