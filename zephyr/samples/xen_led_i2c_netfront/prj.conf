CONFIG_EPP_XEN_XENSTORE=y
CONFIG_EPP_XEN_NETFRONT=y

CONFIG_NETWORKING=y
CONFIG_NET_IPV4=y
CONFIG_NET_IPV6=n
CONFIG_NET_UDP=y
CONFIG_NET_TCP=y
CONFIG_NET_DHCPV4=y
CONFIG_NET_MGMT=y
CONFIG_NET_MGMT_EVENT=y

CONFIG_LOG=y
CONFIG_NET_LOG=y
CONFIG_MAIN_STACK_SIZE=4096

# xenvm has no entropy source; DHCP only needs non-cryptographic random
# numbers (transaction ids, backoff). Not for TLS or other crypto.
CONFIG_TEST_RANDOM_GENERATOR=y
CONFIG_TIMER_RANDOM_GENERATOR=y

CONFIG_GPIO=y
CONFIG_I2C=y
