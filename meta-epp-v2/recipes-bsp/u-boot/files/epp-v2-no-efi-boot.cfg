# epp-v2 boots with boot.scr only. The EFI boot methods make U-Boot query the
# serial terminal size (ESC[6n) with a 100 ms timeout; a late reply
# (ESC[<rows>;<cols>R) stays in the UART FIFO and Xen, which reads the console
# right after U-Boot, takes its final 'R' as the "reboot machine" debug key.
# CONFIG_BOOTMETH_EFI_BOOTMGR is not set
# CONFIG_BOOTMETH_EFILOADER is not set
