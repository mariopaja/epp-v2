# epp-v2 distro policy, applied on top of NXP's fsl-imx-wayland distro.
# Included from conf/auto.conf (written by scripts/yocto-build.sh).

# fsl-imx-extended.inc enables "jailhouse xen" for every image. Keep Xen,
# drop the Jailhouse hypervisor (removes jailhouse-imx and pyjailhouse).
DISTRO_FEATURES:remove = "jailhouse"
