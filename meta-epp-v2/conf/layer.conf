BBPATH .= ":${LAYERDIR}"
BBFILES += "${LAYERDIR}/recipes-*/*/*.bb \
            ${LAYERDIR}/recipes-*/*/*.bbappend"

BBFILE_COLLECTIONS += "meta-epp-v2"
BBFILE_PATTERN_meta-epp-v2 = "^${LAYERDIR}/"
BBFILE_PRIORITY_meta-epp-v2 = "10"
LAYERDEPENDS_meta-epp-v2 = "core"
LAYERSERIES_COMPAT_meta-epp-v2 = "wrynose whinlatter walnascar"

# Defaults for the board settings. scripts/yocto-build.sh overrides these in
# conf/auto.conf from board.conf.
EPP_HOSTNAME ??= "epp-v2"
EPP_ROOT_PASSWORD_HASH ??= ""
EPP_SSH_ROOT_LOGIN ??= "yes"
EPP_OVERLAYS ??= ""
EPP_FDTFILE ??= "imx95-15x15-frdm.dtb"
EPP_EXTRA_PACKAGES ??= ""
EPP_XEN ??= "no"
EPP_XEN_LINUX_VCPUS ??= "2"
EPP_XEN_LINUX_MEM ??= "4096"
EPP_XEN_DOM0_VCPUS ??= "1"
EPP_XEN_DOM0_MEM ??= "1024"
EPP_XEN_UPLINK ??= "eth0"
EPP_XEN_ZEPHYR_IMAGE_PATH ??= ""
EPP_XEN_ZEPHYR_VCPUS ??= "1"
EPP_XEN_ZEPHYR_MEM ??= "16"
EPP_XEN_ZEPHYR_CPU ??= ""
