BBPATH .= ":${LAYERDIR}"
BBFILES += "${LAYERDIR}/recipes-*/*/*.bb \
            ${LAYERDIR}/recipes-*/*/*.bbappend"

BBFILE_COLLECTIONS += "meta-epp-v2"
BBFILE_PATTERN_meta-epp-v2 = "^${LAYERDIR}/"
BBFILE_PRIORITY_meta-epp-v2 = "10"
LAYERDEPENDS_meta-epp-v2 = "core"
LAYERSERIES_COMPAT_meta-epp-v2 = "wrynose whinlatter walnascar"

# Defaults for the board settings. scripts/yocto-build.sh overrides these in
# conf/auto.conf from board.conf.
EPP_HOSTNAME ??= "epp-v2"
EPP_ROOT_PASSWORD_HASH ??= ""
EPP_SSH_ROOT_LOGIN ??= "yes"
EPP_OVERLAYS ??= ""
EPP_FDTFILE ??= "imx95-15x15-frdm.dtb"
EPP_EXTRA_PACKAGES ??= ""
EPP_XEN ??= "no"
EPP_XEN_LINUX_VCPUS ??= "2"
EPP_XEN_LINUX_MEM ??= "4096"
EPP_XEN_DOM0_VCPUS ??= "1"
EPP_XEN_DOM0_MEM ??= "1024"
EPP_XEN_UPLINK ??= "eth0"
EPP_XEN_ZEPHYR_IMAGE_PATH ??= ""
EPP_XEN_ZEPHYR_VCPUS ??= "1"
EPP_XEN_ZEPHYR_MEM ??= "16"
EPP_XEN_ZEPHYR_CPU ??= ""
EPP_XEN_ZEPHYR_PASSTHROUGH ??= ""

# Hardware Xen can pass through to the Zephyr DomU (with EPP_XEN_ZEPHYR_IMAGE):
# the devices in EPP_XEN_ZEPHYR_PT_FIXED always, plus any combination of
# EPP_XEN_ZEPHYR_PT_OPTIONS, selected at boot (epp-passthrough in Dom0;
# default EPP_XEN_ZEPHYR_PASSTHROUGH). Per device: the host device tree node
# and a description, and the fragments epp-zephyr-<name>-pt.dtsi and
# epp-zephyr-<name>-pins.dtsi in recipes-bsp/epp-v2-overlays/files/. Options
# that share pins are listed in EPP_XEN_ZEPHYR_PT_CONFLICTS (a:b pairs) and
# never selected together.
EPP_XEN_ZEPHYR_PT_FIXED = "gpio2"
EPP_XEN_ZEPHYR_PT_OPTIONS = "lpi2c4 lpi2c5 lpi2c6 lpi2c7 lpspi7"
# lpi2c7 and lpspi7 both use GPIO_IO06/IO07 (pins 31/26)
EPP_XEN_ZEPHYR_PT_CONFLICTS = "lpi2c7:lpspi7"
EPP_XEN_ZEPHYR_PT_NODE[gpio2] = "/soc/gpio@43810000"
EPP_XEN_ZEPHYR_PT_NODE[lpi2c4] = "/soc/bus@42000000/i2c@42540000"
EPP_XEN_ZEPHYR_PT_NODE[lpi2c5] = "/soc/bus@42000000/i2c@426b0000"
EPP_XEN_ZEPHYR_PT_NODE[lpi2c6] = "/soc/bus@42000000/i2c@426c0000"
EPP_XEN_ZEPHYR_PT_NODE[lpi2c7] = "/soc/bus@42000000/i2c@426d0000"
EPP_XEN_ZEPHYR_PT_NODE[lpspi7] = "/soc/bus@42000000/spi@42710000"
# Every combination of the options without a conflicting pair, named by its
# options in EPP_XEN_ZEPHYR_PT_OPTIONS order joined with "_" ("none": no
# option). The build prepares one partial device tree and pin mux overlay per
# combination.
EPP_XEN_ZEPHYR_PT_COMBOS = "${@(lambda o, x: ' '.join('_'.join(c) or 'none' for r in range(len(o) + 1) for c in __import__('itertools').combinations(o, r) if not any(a in c and b in c for a, b in x)))(d.getVar('EPP_XEN_ZEPHYR_PT_OPTIONS').split(), [p.split(':') for p in d.getVar('EPP_XEN_ZEPHYR_PT_CONFLICTS').split()])}"
# The combination of EPP_XEN_ZEPHYR_PASSTHROUGH (space separated, any order)
EPP_XEN_ZEPHYR_PT_DEFAULT = "${@'_'.join(o for o in d.getVar('EPP_XEN_ZEPHYR_PT_OPTIONS').split() if o in (d.getVar('EPP_XEN_ZEPHYR_PASSTHROUGH') or '').split()) or 'none'}"
EPP_XEN_ZEPHYR_PT_DESC[gpio2] = "GPIO2: RGB LED D19, GPIO_IOxx pins of the 40-pin header"
EPP_XEN_ZEPHYR_PT_DESC[lpi2c4] = "LPI2C4: display I2C bus (IT6263 HDMI bridge, PCA9632), Linux loses HDMI"
EPP_XEN_ZEPHYR_PT_DESC[lpi2c5] = "LPI2C5: I2C of the 40-pin header, pin 27 SDA, pin 28 SCL"
EPP_XEN_ZEPHYR_PT_DESC[lpi2c6] = "LPI2C6: I2C of the 40-pin header, pin 3 SDA, pin 5 SCL"
EPP_XEN_ZEPHYR_PT_DESC[lpi2c7] = "LPI2C7: I2C of the 40-pin header, pin 31 SDA, pin 26 SCL"
EPP_XEN_ZEPHYR_PT_DESC[lpspi7] = "LPSPI7: SPI of the 40-pin header, SCK 26, MOSI 31, MISO 29, CS 35 (GPIO), RST 37"
