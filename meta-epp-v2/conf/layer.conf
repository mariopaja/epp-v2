BBPATH .= ":${LAYERDIR}"
BBFILES += "${LAYERDIR}/recipes-*/*/*.bb \
            ${LAYERDIR}/recipes-*/*/*.bbappend"

BBFILE_COLLECTIONS += "meta-epp-v2"
BBFILE_PATTERN_meta-epp-v2 = "^${LAYERDIR}/"
BBFILE_PRIORITY_meta-epp-v2 = "10"
LAYERDEPENDS_meta-epp-v2 = "core"
LAYERSERIES_COMPAT_meta-epp-v2 = "wrynose whinlatter walnascar"

# Defaults for the board settings. scripts/yocto-build.sh overrides these in
# conf/auto.conf from board.conf.
EPP_HOSTNAME ??= "epp-v2"
EPP_ROOT_PASSWORD_HASH ??= ""
EPP_SSH_ROOT_LOGIN ??= "yes"
EPP_OVERLAYS ??= ""
EPP_FDTFILE ??= "imx95-15x15-frdm.dtb"
EPP_EXTRA_PACKAGES ??= ""
EPP_XEN ??= "no"
EPP_XEN_LINUX_VCPUS ??= "2"
EPP_XEN_LINUX_MEM ??= "4096"
EPP_XEN_DOM0_VCPUS ??= "1"
EPP_XEN_DOM0_MEM ??= "1024"
EPP_XEN_UPLINK ??= "eth0"
EPP_XEN_ZEPHYR_IMAGE_PATH ??= ""
EPP_XEN_ZEPHYR_VCPUS ??= "1"
EPP_XEN_ZEPHYR_MEM ??= "16"
EPP_XEN_ZEPHYR_CPU ??= ""
EPP_XEN_ZEPHYR_PASSTHROUGH ??= ""

# Hardware Xen can pass through to the Zephyr DomU (with EPP_XEN_ZEPHYR_IMAGE):
# the devices in EPP_XEN_ZEPHYR_PT_FIXED always, plus at most one of
# EPP_XEN_ZEPHYR_PT_OPTIONS, selected at boot (epp-passthrough in Dom0;
# default EPP_XEN_ZEPHYR_PASSTHROUGH). Per device: the host device tree node
# and a description, and the fragments epp-zephyr-<name>-pt.dtsi and
# epp-zephyr-<name>-pins.dtsi in recipes-bsp/epp-v2-overlays/files/.
EPP_XEN_ZEPHYR_PT_FIXED = "gpio2"
EPP_XEN_ZEPHYR_PT_OPTIONS = "lpi2c4 lpi2c6"
EPP_XEN_ZEPHYR_PT_NODE[gpio2] = "/soc/gpio@43810000"
EPP_XEN_ZEPHYR_PT_NODE[lpi2c4] = "/soc/bus@42000000/i2c@42540000"
EPP_XEN_ZEPHYR_PT_NODE[lpi2c6] = "/soc/bus@42000000/i2c@426c0000"
EPP_XEN_ZEPHYR_PT_DESC[gpio2] = "GPIO2: RGB LED D19, GPIO_IOxx pins of the 40-pin header"
EPP_XEN_ZEPHYR_PT_DESC[lpi2c4] = "LPI2C4: display I2C bus (IT6263 HDMI bridge, PCA9632), Linux loses HDMI"
EPP_XEN_ZEPHYR_PT_DESC[lpi2c6] = "LPI2C6: I2C of the 40-pin header, pin 3 SDA, pin 5 SCL"
