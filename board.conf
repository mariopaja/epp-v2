# epp-v2 board configuration.
# Read by scripts/yocto-build.sh (inside the container) and turned into
# conf/auto.conf in the Yocto build directory on every build.

# Device hostname
EPP_HOSTNAME="epp-v2"

# Default root password (hashed with SHA-512 at build time, never stored in
# the image in clear text). Change it before shipping a device.
EPP_ROOT_PASSWORD="root1234"

# Allow root login over SSH with password
EPP_SSH_ROOT_LOGIN="yes"

# Device tree overlays applied by U-Boot at boot (space separated .dtbo names).
# Sources live in meta-epp-v2/recipes-bsp/epp-v2-overlays/files/*.dtso and end
# up on the boot partition under overlays/. Can also be overridden at runtime
# from the U-Boot prompt:  setenv epp_overlays "foo.dtbo bar.dtbo"; saveenv
EPP_OVERLAYS=""

# Base device tree U-Boot loads before applying overlays
EPP_FDTFILE="imx95-15x15-frdm.dtb"

# Xen (only used when building with ./docker-run.sh --xen=<mode>).
# CPU cores and RAM (MB) of the epp-v2 Linux: Dom0 with --xen=dom0, DomU with
# --xen=domu / --xen=dom0less. The i.MX95 has 6 cores and ~7.75 GB usable RAM.
EPP_XEN_LINUX_VCPUS="2"
EPP_XEN_LINUX_MEM="4096"
# Minimal control Dom0 with --xen=domu / --xen=dom0less
EPP_XEN_DOM0_VCPUS="1"
EPP_XEN_DOM0_MEM="1024"
# Dom0 network port bridged to xenbr0 (the epp-v2 DomU gets its network
# through it) with --xen=domu / --xen=dom0less
EPP_XEN_UPLINK="eth0"

# Extra packages to add to the image (space separated)
EPP_EXTRA_PACKAGES="packagegroup-fsl-gstreamer1.0 docker-moby"
