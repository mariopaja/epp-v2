# epp-v2 board configuration.
# Read by scripts/yocto-build.sh (inside the container) and turned into
# conf/auto.conf in the Yocto build directory on every build.

# Device hostname
EPP_HOSTNAME="epp-v2"

# Default root password (hashed with SHA-512 at build time, never stored in
# the image in clear text). Change it before shipping a device.
EPP_ROOT_PASSWORD="root1234"

# Allow root login over SSH with password
EPP_SSH_ROOT_LOGIN="yes"

# Device tree overlays applied by U-Boot at boot (space separated .dtbo names).
# Sources live in meta-epp-v2/recipes-bsp/epp-v2-overlays/files/*.dtso and end
# up on the boot partition under overlays/. Can also be overridden at runtime
# from the U-Boot prompt:  setenv epp_overlays "foo.dtbo bar.dtbo"; saveenv
EPP_OVERLAYS=""

# Base device tree U-Boot loads before applying overlays
EPP_FDTFILE="imx95-15x15-frdm.dtb"

# Cortex-M7 firmware started by the System Manager at power-on (packed into
# the boot container as m7_image.bin). Path relative to this directory, e.g.
# a Zephyr zephyr.bin copied to m7/. Empty: NXP's M7 demo
# (imx95-15x15-frdm_m7_TCM_power_mode_switch.bin). "none": no M7 image at all
# (boot container flash_a55), the M7 stays off.
EPP_M7_IMAGE=""

# Xen (only used when building with ./docker-run.sh --xen=<mode>).
# CPU cores and RAM (MB) of the epp-v2 Linux: Dom0 with --xen=dom0, DomU with
# --xen=domu / --xen=dom0less. The i.MX95 has 6 cores and ~7.75 GB usable RAM.
EPP_XEN_LINUX_VCPUS="2"
EPP_XEN_LINUX_MEM="4096"
# Minimal control Dom0 with --xen=domu / --xen=dom0less
EPP_XEN_DOM0_VCPUS="1"
EPP_XEN_DOM0_MEM="1024"
# Dom0 network port bridged to xenbr0 (the epp-v2 DomU gets its network
# through it) with --xen=domu / --xen=dom0less
EPP_XEN_UPLINK="eth0"
# Zephyr as a second DomU next to the epp-v2 Linux (--xen=dom0less only):
# raw zephyr.bin built for xenvm/xenvm/gicv3 with zephyr/xen/xenvm-dom0less
# .overlay and .conf (see zephyr/README.md). Path relative to this directory.
# Empty: no Zephyr DomU. RAM in MB, at least the RAM of the Zephyr image
# (16 MB for xenvm).
EPP_XEN_ZEPHYR_IMAGE=""
EPP_XEN_ZEPHYR_VCPUS="1"
EPP_XEN_ZEPHYR_MEM="16"
# Physical A55 core (1-5) reserved for the Zephyr DomU: own cpupool with the
# null scheduler, so its vCPU always runs on this core and nothing else does.
# Empty: the Zephyr DomU shares the cores with Dom0 and Linux (credit2). Core
# 0 is Xen's boot CPU and stays in Pool-0. Use EPP_XEN_ZEPHYR_VCPUS="1".
EPP_XEN_ZEPHYR_CPU="5"
# Hardware passed through by Xen to the Zephyr DomU, space separated (empty:
# none). The device then belongs only to the Zephyr DomU (Dom0 loses it), and
# the Zephyr image needs a node for it (see zephyr/README.md).
#   gpio2   GPIO2: RGB LED D19 (green GPIO_IO04, blue GPIO_IO12, red
#           GPIO_IO13) and the GPIO_IOxx pins of the 40-pin header
#           ("epp,xen-rgpio", zephyr/samples/xen_led_passthrough)
#   lpi2c4  LPI2C4 (Linux i2c-3), the display I2C bus: IT6263 HDMI bridge,
#           PCA9632 backlight ("epp,xen-lpi2c", zephyr/samples/xen_i2c_passthrough)
EPP_XEN_ZEPHYR_PASSTHROUGH=""

# Extra packages to add to the image (space separated)
EPP_EXTRA_PACKAGES="packagegroup-fsl-gstreamer1.0 docker-moby"
